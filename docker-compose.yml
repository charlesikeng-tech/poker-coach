# Local development: only PostgreSQL by default (the API and the web app run from your IDE / CLI).
# `docker compose --profile app up --build` also runs the production image against it, to try the
# container before a release (http://localhost:8080; Google sign-in needs that redirect URI too).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poker_coach
      POSTGRES_USER: ${POSTGRES_USER:-poker_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
    ports:
      # Host port configurable: 5432 is often taken by another local PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images store data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    profiles: [app]
    build: .
    command: ["migrate"]
    environment: &app-environment
      ConnectionStrings__PokerCoach: Host=postgres;Database=poker_coach;Username=${POSTGRES_USER:-poker_coach};Password=${POSTGRES_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Coaching__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      Email__BrevoApiKey: ${BREVO_API_KEY:-}
      Email__FromAddress: ${EMAIL_FROM:-no-reply@poker-coach.local}
      App__PublicUrl: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  app:
    profiles: [app]
    build: .
    environment:
      <<: *app-environment
      # Plain http on localhost: no Secure-only cookies.
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
