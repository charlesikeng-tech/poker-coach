@let s = scales();
<svg
  #svg
  [attr.width]="width()"
  [attr.height]="height()"
  role="img"
  [attr.aria-label]="ariaLabel()"
  tabindex="0"
  (pointermove)="onPointer($event, svg)"
  (pointerdown)="onPointer($event, svg)"
  (pointerleave)="active.set(null)"
  (keydown)="onKey($event)"
  (blur)="active.set(null)"
>
  @for (tick of s.ticks; track tick) {
    <line
      class="grid"
      [class.grid--zero]="tick === 0"
      [attr.x1]="margin.left"
      [attr.x2]="width() - margin.right"
      [attr.y1]="s.y(tick)"
      [attr.y2]="s.y(tick)"
    />
    <text
      class="tick"
      [attr.x]="margin.left - 8"
      [attr.y]="s.y(tick)"
      text-anchor="end"
      dominant-baseline="middle"
    >
      {{ formatY()(tick) }}
    </text>
  }
  <text class="tick" [attr.x]="margin.left" [attr.y]="height() - 8">{{ s.xMin }}</text>
  <text class="tick" [attr.x]="width() - margin.right" [attr.y]="height() - 8" text-anchor="end">
    {{ s.xMax }}
  </text>

  <defs>
    <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="fill-top" />
      <stop offset="100%" class="fill-bottom" />
    </linearGradient>
  </defs>
  <!-- Keyed on the path: new data redraws the line from its start (CSS draw-in). -->
  @if (referencePath()) {
    <path class="reference" [attr.d]="referencePath()" />
  }
  @for (d of [path()]; track d) {
    <path class="area" [attr.d]="area()" [attr.fill]="'url(#' + gradientId + ')'" />
    <path class="line" [attr.d]="d" pathLength="1" />
  }

  @for (m of placedMarkers(); track m.pointIndex) {
    <g class="chart-marker" [attr.data-tone]="m.tone">
      <line [attr.x1]="m.cx" [attr.x2]="m.cx" [attr.y1]="m.cy" [attr.y2]="m.cy - 16" />
      <circle [attr.cx]="m.cx" [attr.cy]="m.cy - 24" r="9" />
      <text [attr.x]="m.cx" [attr.y]="m.cy - 24" text-anchor="middle" dominant-baseline="central">
        {{ m.label }}
      </text>
    </g>
  }

  @if (activePoint(); as point) {
    <line
      class="crosshair"
      [attr.x1]="s.x(point.x)"
      [attr.x2]="s.x(point.x)"
      [attr.y1]="margin.top"
      [attr.y2]="height() - margin.bottom"
    />
    <circle class="marker-halo" [attr.cx]="s.x(point.x)" [attr.cy]="s.y(point.y)" r="10" />
    <circle class="marker" [attr.cx]="s.x(point.x)" [attr.cy]="s.y(point.y)" r="4.5" />
  }
</svg>

@if (activePoint(); as point) {
  <div
    class="tooltip"
    role="status"
    [class.tooltip--right]="tooltipLeft()"
    [style.left.px]="tooltipLeft() ? s.x(point.x) + 12 : null"
    [style.right.px]="tooltipLeft() ? null : width() - s.x(point.x) + 12"
  >
    <strong>{{ point.label }}</strong>
    @for (line of point.details; track $index) {
      <span>{{ line }}</span>
    }
  </div>
}
