<ng-container *transloco="let t; prefix: 'pages.ev'">
  <app-page-header [heading]="t('title')" [description]="t('description')" />

  <div class="layout">
    <section class="glass panel inputs">
      <h2>{{ t('inputs') }}</h2>

      <div class="fields">
        <label class="field">
          <span>{{ t('pot') }}</span>
          <input
            type="number"
            inputmode="decimal"
            min="0"
            step="1"
            [value]="pot()"
            (change)="update('pot', $any($event.target).value)"
          />
        </label>
        <label class="field">
          <span>{{ t('call') }}</span>
          <input
            type="number"
            inputmode="decimal"
            min="1"
            step="1"
            [value]="callAmount()"
            (change)="update('callAmount', $any($event.target).value)"
          />
        </label>
        <label class="field">
          <span>{{ t('winPct') }}</span>
          <div class="input-with-unit">
            <input
              type="number"
              inputmode="decimal"
              min="0"
              max="100"
              step="0.5"
              [value]="winPct()"
              (change)="update('winPct', $any($event.target).value)"
            />
            <span class="unit">%</span>
          </div>
        </label>
        <label class="field">
          <span>{{ t('raise') }}</span>
          <input
            type="number"
            inputmode="decimal"
            min="1"
            step="1"
            [value]="raiseAmount()"
            (change)="update('raiseAmount', $any($event.target).value)"
          />
        </label>
        <label class="field">
          <span>{{ t('foldEquity') }}</span>
          <div class="input-with-unit">
            <input
              type="number"
              inputmode="decimal"
              min="0"
              max="100"
              step="1"
              [value]="foldEquityPct()"
              (change)="update('foldEquityPct', $any($event.target).value)"
            />
            <span class="unit">%</span>
          </div>
        </label>
      </div>
    </section>

    <section class="glass panel results">
      <h2>{{ t('results') }}</h2>

      @if (evBars().length > 0) {
        <div class="ev-bars">
          @for (bar of evBars(); track bar.action) {
            <div class="ev-bar-row" [class.ev-bar-row--best]="bar.isBest">
              <span class="ev-bar-label">{{ t('action.' + bar.action) }}</span>
              <div class="ev-bar-track">
                <div class="ev-bar-zero"></div>
                <div
                  class="ev-bar-fill"
                  [class.positive]="bar.isPositive"
                  [class.negative]="!bar.isPositive"
                  [style.width.%]="bar.pct"
                ></div>
              </div>
              <span
                class="ev-bar-value"
                [class.positive]="bar.isPositive"
                [class.negative]="!bar.isPositive"
              >
                {{ fmt(bar.ev) }}
              </span>
            </div>
          }
        </div>

        <p class="verdict" [attr.data-action]="bestAction()">
          {{ t('verdict.' + bestAction()) }}
        </p>
      }
    </section>
  </div>

  <aside class="insights glass">
    <p class="insights-head">{{ t('insightHead') }}</p>
    <ul class="insight-list">
      <li>{{ t('insight1') }}</li>
      <li>{{ t('insight2') }}</li>
      <li>{{ t('insight3') }}</li>
    </ul>
  </aside>
</ng-container>
