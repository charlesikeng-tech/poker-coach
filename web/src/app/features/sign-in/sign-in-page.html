<ng-container *transloco="let t; prefix: 'pages.signIn'">
  <div class="sign-in">
    <section class="sign-in__brand" aria-hidden="true">
      <div class="sign-in__mark"><app-brand-mark /></div>
      <p class="sign-in__statement">{{ t('statement') }}</p>
    </section>

    <section class="sign-in__panel">
      <div class="sign-in__language"><app-language-select /></div>

      <div class="sign-in__card">
        <h1>{{ t('heading') }}</h1>
        <p class="sign-in__description">{{ t('description') }}</p>

        @if (providerFailed()) {
          <p class="sign-in__alert" role="alert">{{ t('errors.google') }}</p>
        }

        @if (unavailable()) {
          <p class="sign-in__alert" role="alert">{{ t('errors.unavailable') }}</p>
          <button appButton variant="secondary" type="button" (click)="retry()">
            {{ t('retry') }}
          </button>
        } @else {
          <a appButton variant="primary" class="sign-in__action" [href]="signInUrl()">
            {{ t('action') }}
          </a>
        }

        <p class="sign-in__privacy">{{ t('privacy') }}</p>
      </div>
    </section>
  </div>
</ng-container>
