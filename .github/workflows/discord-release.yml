name: Discord release

on:
  workflow_dispatch:
    inputs:
      test_message:
        description: "Texte du message de test"
        default: "Test du webhook #annonces depuis GitHub Actions"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCES_WEBHOOK }}
          TEST_MESSAGE: ${{ inputs.test_message }}
        run: |
          set -euo pipefail
          [ -n "${WEBHOOK_URL}" ] || { echo "::error::Secret DISCORD_ANNOUNCES_WEBHOOK manquant"; exit 1; }
          jq -n \
            --arg title "Test webhook" \
            --arg desc "$TEST_MESSAGE" \
            '{username:"NutsIQ",allowed_mentions:{parse:[]},embeds:[{title:$title,description:$desc,color:13938487,footer:{text:"Changelog NutsIQ"},timestamp:(now|todate)}]}' \
          | curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @- \
            "$WEBHOOK_URL"
