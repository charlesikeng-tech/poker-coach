name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Restore
        run: dotnet restore PokerCoach.slnx
      - name: Format check
        run: dotnet format PokerCoach.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build PokerCoach.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test --solution PokerCoach.slnx --configuration Release --no-build
      - name: Vulnerable packages
        run: |
          dotnet list PokerCoach.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -qi "has the following vulnerable packages" vulnerable.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npx -y npm@11 ci
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,html,scss}" "public/i18n/*.json"
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test -- --watch=false
      - name: Audit (production dependencies)
        run: |
          for attempt in 1 2 3; do
            npm audit --omit=dev --audit-level=high && exit 0
            echo "::warning::npm audit attempt $attempt failed, retrying in 10s…"
            sleep 10
          done
          exit 1

  # The production image (ADR-0011): built on every run, smoke-tested against a real PostgreSQL
  # (migrations + readiness), published to GHCR from main only.
  image:
    runs-on: ubuntu-latest
    needs: [backend, web]
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poker_coach
          POSTGRES_USER: poker_coach
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker_coach -d poker_coach"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: poker-coach:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (migrate, then ready)
        run: |
          app_env=(
            -e "ConnectionStrings__PokerCoach=Host=localhost;Database=poker_coach;Username=poker_coach;Password=ci-only"
            -e Authentication__Google__ClientId=ci -e Authentication__Google__ClientSecret=ci
            -e App__PublicUrl=http://localhost:8080
          )
          docker run --rm --network host "${app_env[@]}" poker-coach:ci migrate
          docker run -d --name app --network host "${app_env[@]}" poker-coach:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health/ready && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health/ready
          curl -fsS http://localhost:8080/sign-in | grep -q "<app-root>"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/me)" = 401
      - name: Container logs
        if: failure()
        run: docker logs app || true
      # Edge (ADR-0019): Caddy + landing page, released with the same sha as the app.
      - name: Build edge
        run: docker build -f deploy/Dockerfile.edge -t poker-coach-edge:ci .
      - name: Check edge (Caddyfile valid, landing page served)
        run: |
          docker run --rm -e APP_DOMAIN=app.example.com -e SITE_DOMAIN=example.com -e ACME_EMAIL=ci@example.com \
            poker-coach-edge:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm poker-coach-edge:ci sh -c 'test -f /srv/site/index.html && test ! -e /srv/site/README.md'
      - name: Check deploy compose
        run: |
          cd deploy/scaleway
          cp env.example .env && cp app.env.example app.env
          docker compose config --quiet
          docker compose --profile release config --services | grep -qx migrate
      - name: Publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="${IMAGE,,}"
          for tag in "${{ github.sha }}" main; do
            docker tag poker-coach:ci "$image:$tag"
            docker tag poker-coach-edge:ci "$image-edge:$tag"
            docker push "$image:$tag"
            docker push "$image-edge:$tag"
          done

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to Scaleway
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/nutsiq/deploy/scaleway && ./deploy.sh ${{ github.sha }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compute tag
        run: echo "TAG=v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          args: --unreleased --tag ${{ env.TAG }} --strip header --output release-notes.md
        continue-on-error: true
      - name: Ensure release notes exist
        run: test -s release-notes.md || echo "Première release NutsIQ." > release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "${{ github.sha }}"
          fi
      - name: Announce on Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ANNOUNCES_WEBHOOK }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${WEBHOOK_URL}" ] || { echo "No webhook configured, skipping."; exit 0; }
          URL="https://github.com/${REPO}/releases/tag/${TAG}"
          DESCRIPTION=$(cat release-notes.md)
          DESCRIPTION="${DESCRIPTION:-Nouvelle version disponible.}"
          if [ "${#DESCRIPTION}" -gt 3900 ]; then
            DESCRIPTION="${DESCRIPTION:0:3900}"
          fi
          jq -n \
            --arg title "NutsIQ ${TAG}" \
            --arg desc "$DESCRIPTION" \
            --arg url "$URL" \
            '{username:"NutsIQ",allowed_mentions:{parse:[]},embeds:[{title:$title,description:$desc,color:13938487,url:$url,footer:{text:"Changelog NutsIQ"},timestamp:(now|todate)}]}' \
          | curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @- \
            "$WEBHOOK_URL"
